# Files whose "secrets" are invented test values in real provider formats: the
# detectors must see realistic keys to be tested. Listed one by one, so a real
# key added anywhere else still raises an alert.
paths-ignore:
  - "fixtures/accuracy/corpus.jsonl"
  - "crates/resguardo-core/src/virtual_key.rs"
  - "crates/resguardo-egress/src/credential.rs"
  - "crates/resguardo-proto/src/json.rs"
  - "crates/resguardo-proto/src/request.rs"
  - "crates/resguardo-scan/src/decode.rs"
  - "crates/resguardo/tests/server.rs"
