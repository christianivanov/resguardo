[workspace]
resolver = "3"
members = ["crates/*", "tools/mock-upstream"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/christianivanov/resguardo"
authors = ["Christian Ivanov del Real"]

# Internal crates, added here only once some crate uses them. Allowed edges (Annex C):
#   scan, policy, proto, audit -> core
#   egress -> core, audit   (never scan or policy)
#   resguardo (binary) -> all
[workspace.dependencies]
resguardo-audit = { path = "crates/resguardo-audit", version = "0.0.0" }
resguardo-core = { path = "crates/resguardo-core", version = "0.0.0" }
resguardo-egress = { path = "crates/resguardo-egress", version = "0.0.0" }
resguardo-mock-upstream = { path = "tools/mock-upstream", version = "0.0.0" }
resguardo-policy = { path = "crates/resguardo-policy", version = "0.0.0" }
resguardo-proto = { path = "crates/resguardo-proto", version = "0.0.0" }
resguardo-scan = { path = "crates/resguardo-scan", version = "0.0.0" }

# External crates. Versions checked on crates.io on 2026-11-25 (base64, regex and
# unicode-normalization on 2026-11-26).
anyhow = "1.0.105"
axum = "0.8.9"
# Without `simd-unsafe`, its only source of `unsafe` (hyper-util still enables it in the binary).
# Ed25519 for the audit log, from the provider rustls already uses (ADR 0006, ADR 0015).
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["aws-lc-sys"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
clap = { version = "4.6.10", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
# Linear-time matching on every input; never `fancy-regex`.
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false }
rustls = { version = "0.23.46", default-features = false }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing"] }
toml = "1.2.3"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
unicode-normalization = "0.1.26"
url = "2.5.9"
uuid = { version = "1.29.3", default-features = false, features = ["std"] }
zeroize = "1.9.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# No unwrap/expect outside tests (allowed in tests via clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
