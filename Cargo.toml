[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/christianivanov/resguardo"
authors = ["Christian Ivanov del Real"]

# Internal crates, added here only once some crate uses them. Allowed edges (Annex C):
#   scan, policy, proto, audit -> core
#   egress -> core, audit   (never scan or policy)
#   resguardo (binary) -> all
[workspace.dependencies]
resguardo-core = { path = "crates/resguardo-core", version = "0.0.0" }

# External crates. Versions checked on crates.io on 2026-11-25.
anyhow = "1.0.105"
axum = "0.8.9"
clap = { version = "4.6.10", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing"] }
toml = "1.2.3"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# No unwrap/expect outside tests (allowed in tests via clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
