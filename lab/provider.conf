# The lab's "provider": TLS with the lab certificate, in front of the mock.
server {
    listen 443 ssl;
    server_name provider;
    ssl_certificate     /certs/provider.pem;
    ssl_certificate_key /certs/provider-key.pem;
    location / {
        proxy_pass http://mock:9000;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
}
