# cargo-deny configuration. Run locally with `cargo deny check`.

[graph]
all-features = true
# Only the platforms Resguardo is built for. Without this, crates used only on Android or
# WebAssembly (pulled in by rustls-platform-verifier) are checked too, although they are
# never compiled into Resguardo.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# Fail on any vulnerability or unmaintained/yanked crate unless ignored here with a reason.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with Apache-2.0. Anything else needs a discussion first.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # Only libfuzzer-sys, in fuzz/: LLVM's libFuzzer code it bundles. fuzz/ is a separate
    # workspace and never part of the Resguardo binary (milestone M4.5).
    "NCSA",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Crate boundaries (docs: Annex C). `wrappers` lists the only crates allowed to depend
# on the banned crate directly; in particular resguardo-egress must never see scanning
# or policy, so the egress side can become its own process later.
deny = [
    { crate = "resguardo-scan", wrappers = ["resguardo", "resguardo-bench"] },
    { crate = "resguardo-policy", wrappers = ["resguardo"] },
    { crate = "resguardo-proto", wrappers = ["resguardo"] },
    { crate = "resguardo-egress", wrappers = ["resguardo"] },
    { crate = "resguardo-audit", wrappers = ["resguardo", "resguardo-bench", "resguardo-egress"] },
    # ADR 0006: TLS uses aws-lc-rs. A second crypto provider must not slip in.
    { crate = "ring", reason = "ADR 0006: rustls uses aws-lc-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
